            {tab === 'calculator' && (
              <div className="py-12 px-4 max-w-4xl mx-auto">
                <div className="card-cargolith p-8 sm:p-12 space-y-8 shadow-card">
                  <div className="text-center space-y-2">
                    <span className="text-xs font-bold text-cargolith-blue bg-blue-50 border border-blue-200 px-3 py-1 rounded-full uppercase tracking-widest">Revenue Estimator</span>
                    <h2 className="text-3xl font-extrabold text-cargolith-navy font-heading">Calculate Your Weekly Truck Earnings</h2>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-6 bg-slate-50 p-6 rounded-2xl border border-slate-200">
                    <div>
                      <label className="block text-xs font-bold text-slate-700 uppercase mb-2">Select Equipment Type</label>
                      <select 
                        value={equipType} 
                        onChange={e => setEquipType(e.target.value)}
                        className="w-full bg-white border border-slate-300 rounded-xl p-3 text-sm font-bold text-cargolith-navy"
                      >
                        <option value="Dry Van">Dry Van ($2.85/mi)</option>
                        <option value="Reefer">Reefer ($3.35/mi)</option>
                        <option value="Flatbed">Flatbed ($3.50/mi)</option>
                        <option value="Step Deck">Step Deck ($3.75/mi)</option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-700 uppercase mb-2">Weekly Miles: {miles} mi</label>
                      <input 
                        type="range" 
                        min="1000" 
                        max="4500" 
                        step="100" 
                        value={miles} 
                        onChange={e => setMiles(Number(e.target.value))}
                        className="w-full accent-cargolith-blue mt-3"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 text-center">
                    <div className="p-5 rounded-2xl bg-blue-50 border border-blue-200">
                      <span className="text-xs text-slate-500 uppercase font-bold block">Est. Weekly Gross</span>
                      <span className="text-3xl font-black font-mono text-cargolith-navy">${grossRev.toLocaleString()}</span>
                    </div>
                    <div className="p-5 rounded-2xl bg-slate-50 border border-slate-200">
                      <span className="text-xs text-slate-500 uppercase font-bold block">5% Commission Fee</span>
                      <span className="text-2xl font-bold font-mono text-slate-700">-${fee.toLocaleString()}</span>
                    </div>
                    <div className="p-5 rounded-2xl bg-emerald-50 border border-emerald-200">
                      <span className="text-xs text-emerald-800 uppercase font-bold block">Est. Net Take-Home</span>
                      <span className="text-3xl font-black font-mono text-emerald-700">${netTakeHome.toLocaleString()}</span>
                    </div>
                  </div>

                  <div className="text-center pt-4">
                    <button onClick={() => setTab('carriers')} className="btn-cargolith px-8 py-4 rounded-xl text-xs uppercase font-extrabold">
                      Claim This Revenue Rate Now
                    </button>
                  </div>
                </div>
              </div>
            )}

            {tab === 'services' && (
              <div className="py-12 px-4 max-w-5xl mx-auto space-y-12">
                <div className="text-center space-y-3">
                  <h2 className="text-3xl font-extrabold text-cargolith-navy font-heading">Transparent Dispatch Pricing</h2>
                  <p className="text-slate-600 text-sm">No signup fees, no monthly software charges, no hidden lock-ins.</p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                  
                  <div className="card-cargolith p-8 space-y-6">
                    <h3 className="text-xl font-bold text-cargolith-navy">Owner-Op Flex</h3>
                    <div className="text-4xl font-black text-cargolith-navy font-mono">6% <span className="text-xs font-normal text-slate-500">/ gross load</span></div>
                    <p className="text-xs text-slate-600">Ideal for single owner-operators looking for maximum freedom and high RPM.</p>
                    <ul className="space-y-2 text-xs text-slate-700">
                      <li>✓ Dedicated Single Dispatcher</li>
                      <li>✓ Top-Rate Negotiation</li>
                      <li>✓ No Forced Dispatch</li>
                      <li>✓ 24/7 Driver Support</li>
                    </ul>
                    <button onClick={() => setTab('carriers')} className="btn-silver w-full py-3 rounded-xl text-xs font-bold">Select Flex</button>
                  </div>

                  <div className="card-cargolith p-8 space-y-6 border-2 border-cargolith-blue shadow-chrome relative bg-blue-50/30">
                    <div className="absolute -top-3 left-1/2 -translate-x-1/2 bg-cargolith-navy text-white text-[10px] font-black uppercase px-3 py-1 rounded-full">Most Popular</div>
                    <h3 className="text-xl font-bold text-cargolith-navy">Dedicated Carrier</h3>
                    <div className="text-4xl font-black text-cargolith-navy font-mono">5% <span className="text-xs font-normal text-slate-500">/ gross load</span></div>
                    <p className="text-xs text-slate-600">For full-time carriers running consistent weekly lane capacity.</p>
                    <ul className="space-y-2 text-xs text-slate-700">
                      <li>✓ Everything in Flex Plan</li>
                      <li>✓ Dedicated Lane Scouting</li>
                      <li>✓ NOA Factoring Support</li>
                      <li>✓ Priority Load Booking</li>
                    </ul>
                    <button onClick={() => setTab('carriers')} className="btn-cargolith w-full py-3 rounded-xl text-xs font-extrabold uppercase">Select Dedicated</button>
                  </div>

                  <div className="card-cargolith p-8 space-y-6">
                    <h3 className="text-xl font-bold text-cargolith-navy">Fleet Partner</h3>
                    <div className="text-4xl font-black text-cargolith-navy font-mono">4% <span className="text-xs font-normal text-slate-500">/ 3+ Trucks</span></div>
                    <p className="text-xs text-slate-600">Volume dispatch for fleets running 3 to 25 power units.</p>
                    <ul className="space-y-2 text-xs text-slate-700">
                      <li>✓ Fleet Account Manager</li>
                      <li>✓ Multi-Truck Rerouting</li>
                      <li>✓ Custom Billing Summaries</li>
                      <li>✓ Direct Shipper Line</li>
                    </ul>
                    <button onClick={() => setTab('carriers')} className="btn-silver w-full py-3 rounded-xl text-xs font-bold">Select Fleet</button>
                  </div>

                </div>
              </div>
            )}

            {tab === 'carriers' && (
              <div className="py-12 px-4 max-w-2xl mx-auto">
                <div className="card-cargolith p-8 sm:p-10 shadow-float">
                  <div className="text-center mb-8">
                    <span className="text-xs font-bold text-cargolith-blue bg-blue-50 border border-blue-200 px-3 py-1 rounded-full uppercase tracking-widest">Quick Setup</span>
                    <h2 className="text-3xl font-extrabold text-cargolith-navy font-heading mt-2">Carrier Onboarding Packet</h2>
                  </div>

                  {formSubmitted ? (
                    <div className="text-center py-10 space-y-6">
                      <div className="w-16 h-16 rounded-full bg-emerald-100 text-emerald-700 border border-emerald-300 text-3xl flex items-center justify-center mx-auto">✓</div>
                      <h3 className="text-2xl font-bold text-cargolith-navy">Onboarding Packet Submitted!</h3>
                      <p className="text-slate-600 text-sm">Thank you <strong className="text-cargolith-navy">{formData.name}</strong> (MC# {formData.mc}). A senior dispatcher will contact you at <strong className="text-cargolith-navy">{formData.phone}</strong> within 15 minutes.</p>
                      <button onClick={() => { setFormSubmitted(false); setStep(1); }} className="btn-cargolith px-6 py-3 rounded-xl text-xs font-extrabold uppercase">Submit Another Packet</button>
                    </div>
                  ) : (
                    <form onSubmit={handleOnboardSubmit} className="space-y-5">
                      
                      <div className="flex items-center justify-between text-xs font-bold text-slate-500 mb-2">
                        <span className={step >= 1 ? "text-cargolith-blue" : ""}>1. Carrier Details</span>
                        <span className={step >= 2 ? "text-cargolith-blue" : ""}>2. Equipment & Lanes</span>
                        <span className={step >= 3 ? "text-cargolith-blue" : ""}>3. Dispatch Contact</span>
                      </div>
                      <div className="w-full bg-slate-100 h-2 rounded-full overflow-hidden mb-6 border border-slate-200">
                        <div className="bg-cargolith-blue h-full transition-all duration-300" style={{ width: `${(step / 3) * 100}%` }}></div>
                      </div>

                      {step === 1 && (
                        <div className="space-y-4">
                          <div>
                            <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Company / Carrier Name *</label>
                            <input 
                              type="text" 
                              required 
                              placeholder="e.g. Vance Logistics LLC"
                              value={formData.name} 
                              onChange={e => setFormData({...formData, name: e.target.value})}
                              className="w-full bg-white border border-slate-300 rounded-xl p-3 text-sm text-cargolith-navy focus:outline-none focus:border-cargolith-blue"
                            />
                          </div>
                          <div className="grid grid-cols-2 gap-4">
                            <div>
                              <label className="block text-xs font-bold text-slate-700 uppercase mb-1">MC Number *</label>
                              <input 
                                type="text" 
                                required 
                                placeholder="MC-123456"
                                value={formData.mc} 
                                onChange={e => setFormData({...formData, mc: e.target.value})}
                                className="w-full bg-white border border-slate-300 rounded-xl p-3 text-sm text-cargolith-navy focus:outline-none focus:border-cargolith-blue"
                              />
                            </div>
                            <div>
                              <label className="block text-xs font-bold text-slate-700 uppercase mb-1">USDOT Number *</label>
                              <input 
                                type="text" 
                                required 
                                placeholder="DOT-987654"
                                value={formData.dot} 
                                onChange={e => setFormData({...formData, dot: e.target.value})}
                                className="w-full bg-white border border-slate-300 rounded-xl p-3 text-sm text-cargolith-navy focus:outline-none focus:border-cargolith-blue"
                              />
                            </div>
                          </div>
                          <button type="button" onClick={() => setStep(2)} className="btn-cargolith w-full py-3.5 rounded-xl text-xs font-extrabold uppercase mt-4">Next: Equipment & Lanes ➔</button>
                        </div>
                      )}

                      {step === 2 && (
                        <div className="space-y-4">
                          <div>
                            <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Equipment Type *</label>
                            <select 
                              value={formData.equip} 
                              onChange={e => setFormData({...formData, equip: e.target.value})}
                              className="w-full bg-white border border-slate-300 rounded-xl p-3 text-sm text-cargolith-navy"
                            >
                              <option value="Dry Van (53ft)">Dry Van (53ft)</option>
                              <option value="Reefer / Temp Control">Reefer / Temperature Control</option>
                              <option value="Flatbed / Stepdeck">Flatbed / Stepdeck</option>
                              <option value="Power Only">Power Only</option>
                            </select>
                          </div>
                          <div>
                            <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Current Base Location *</label>
                            <input 
                              type="text" 
                              required 
                              placeholder="e.g. Chicago, IL"
                              value={formData.location} 
                              onChange={e => setFormData({...formData, location: e.target.value})}
                              className="w-full bg-white border border-slate-300 rounded-xl p-3 text-sm text-cargolith-navy focus:outline-none focus:border-cargolith-blue"
                            />
                          </div>
                          <div>
                            <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Preferred Operating Lanes *</label>
                            <input 
                              type="text" 
                              required 
                              placeholder="e.g. Midwest to Southeast, Texas Regional"
                              value={formData.lanes} 
                              onChange={e => setFormData({...formData, lanes: e.target.value})}
                              className="w-full bg-white border border-slate-300 rounded-xl p-3 text-sm text-cargolith-navy focus:outline-none focus:border-cargolith-blue"
                            />
                          </div>
                          <div className="flex gap-3 pt-2">
                            <button type="button" onClick={() => setStep(1)} className="btn-silver w-1/3 py-3.5 rounded-xl text-xs font-bold">Back</button>
                            <button type="button" onClick={() => setStep(3)} className="btn-cargolith w-2/3 py-3.5 rounded-xl text-xs font-extrabold uppercase">Next: Contact Info ➔</button>
                          </div>
                        </div>
                      )}

                      {step === 3 && (
                        <div className="space-y-4">
                          <div>
                            <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Dispatch Phone Number *</label>
                            <input 
                              type="tel" 
                              required 
                              placeholder="(555) 000-0000"
                              value={formData.phone} 
                              onChange={e => setFormData({...formData, phone: e.target.value})}
                              className="w-full bg-white border border-slate-300 rounded-xl p-3 text-sm text-cargolith-navy focus:outline-none focus:border-cargolith-blue"
                            />
                          </div>
                          <div>
                            <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Email Address *</label>
                            <input 
                              type="email" 
                              required 
                              placeholder="dispatcher@company.com"
                              value={formData.email} 
                              onChange={e => setFormData({...formData, email: e.target.value})}
                              className="w-full bg-white border border-slate-300 rounded-xl p-3 text-sm text-cargolith-navy focus:outline-none focus:border-cargolith-blue"
                            />
                          </div>
                          <div className="p-3 bg-blue-50 rounded-xl border border-blue-200 text-[11px] text-cargolith-navy font-semibold">
                            ✓ Zero setup fees • You approve all rates before booking • 100% rate transparency
                          </div>
                          <div className="flex gap-3 pt-2">
                            <button type="button" onClick={() => setStep(2)} className="btn-silver w-1/3 py-3.5 rounded-xl text-xs font-bold">Back</button>
                            <button type="submit" disabled={isSubmitting} className="btn-cargolith w-2/3 py-3.5 rounded-xl text-xs font-extrabold uppercase">
                              {isSubmitting ? 'Submitting...' : 'Submit Carrier Packet ✓'}
                            </button>
                          </div>
                        </div>
                      )}

                    </form>
                  )}
                </div>
              </div>
            )}

            {tab === 'contact' && (
              <div className="py-12 px-4 max-w-xl mx-auto">
                <div className="card-cargolith p-8 sm:p-10 text-center space-y-6 shadow-card">
                  <span className="text-xs font-bold text-cargolith-blue bg-blue-50 border border-blue-200 px-3 py-1 rounded-full uppercase tracking-widest">24/7 Live Desk</span>
                  <h2 className="text-3xl font-extrabold text-cargolith-navy font-heading">Direct Dispatch Line</h2>
                  <p className="text-slate-600 text-sm">Call or message our senior dispatch team anytime.</p>

                  <div className="p-6 bg-blue-50 rounded-2xl border border-blue-200 text-left space-y-2">
                    <span className="text-xs text-cargolith-blue font-bold uppercase">Toll-Free Phone Desk</span>
                    <div className="text-3xl font-black font-mono text-cargolith-navy">1-800-CARGOLITH</div>
                    <p className="text-xs text-slate-500 font-medium">Dispatchers active 24 hours / 7 days a week</p>
                  </div>

                  <div className="p-6 bg-emerald-50 rounded-2xl border border-emerald-200 text-left space-y-2">
                    <span className="text-xs text-emerald-800 font-bold uppercase">WhatsApp Direct Chat</span>
                    <div className="text-lg font-bold text-cargolith-navy">Instant Dispatcher Messaging</div>
                    <a href="https://wa.me/18005558782" target="_blank" className="btn-cargolith inline-block px-5 py-2 rounded-xl text-xs font-extrabold uppercase mt-2">Chat Now</a>
                  </div>
                </div>
              </div>
            )}

          </main>

          <footer className="bg-cargolith-darkNavy text-white py-12 px-4 border-t border-slate-800">
            <div className="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-4 gap-8 text-xs">
              <div className="space-y-4">
                <img 
                  src={LOGO_FILE_URI} 
                  alt="Cargolith Dispatching" 
                  className="h-16 w-auto object-contain bg-white p-2 rounded-xl"
                />
                <p className="text-cargolith-silver leading-relaxed">
                  Reliable Dispatch. Smart Solutions. Maximum Results. Nationwide truck dispatch service for independent carriers.
                </p>
              </div>

              <div>
                <h4 className="font-bold text-white text-sm uppercase tracking-wider mb-3">Quick Navigation</h4>
                <ul className="space-y-2 text-cargolith-silver">
                  <li onClick={() => setTab('home')} className="hover:text-white cursor-pointer">• Home</li>
                  <li onClick={() => setTab('loads')} className="hover:text-white cursor-pointer">• Live Load Board</li>
                  <li onClick={() => setTab('calculator')} className="hover:text-white cursor-pointer">• Revenue Calculator</li>
                  <li onClick={() => setTab('carriers')} className="hover:text-white cursor-pointer">• Carrier Onboarding</li>
                </ul>
              </div>

              <div>
                <h4 className="font-bold text-white text-sm uppercase tracking-wider mb-3">Equipment Handled</h4>
                <ul className="space-y-2 text-cargolith-silver">
                  <li>• Dry Van Dispatching</li>
                  <li>• Reefer Temperature Control</li>
                  <li>• Flatbed & Stepdeck</li>
                  <li>• Power Only Hauling</li>
                </ul>
              </div>

              <div>
                <h4 className="font-bold text-white text-sm uppercase tracking-wider mb-3">Contact Desk</h4>
                <p className="text-white font-bold">1-800-CARGOLITH</p>
                <p className="text-cargolith-silver mt-1">dispatch@cargolith.com</p>
                <p className="text-cargolith-silver mt-1">All 48 US States Coverage</p>
              </div>
            </div>

            <div className="max-w-7xl mx-auto mt-8 pt-6 border-t border-slate-800 flex flex-col sm:flex-row items-center justify-between text-cargolith-darkSilver text-[11px]">
              <div>© {new Date().getFullYear()} Cargolith Dispatching LLC. All rights reserved.</div>
              <div className="flex gap-4">
                <span>DAT Verified</span>
                <span>FMCSA Registered</span>
                <span>0% Upfront Contract</span>
              </div>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
